<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Crusader Greathelm (Steel helmet with golden cross visor & red plume) -->
  <!-- Red Plume on top -->
  <polygon points="30,8 34,8 33,2 29,3" fill="#dc2626"/>
  <rect x="29" y="8" width="6" height="3" fill="#991b1b"/>

  <!-- Steel Dome -->
  <rect x="22" y="11" width="20" height="18" fill="#475569"/>
  <rect x="23" y="12" width="18" height="15" fill="#64748b"/>
  <!-- Golden Cross Visor -->
  <rect x="31" y="14" width="2" height="14" fill="#f59e0b"/>
  <rect x="24" y="20" width="16" height="3" fill="#f59e0b"/>
  <!-- Eye Slits inside Cross -->
  <rect x="26" y="21" width="4" height="1" fill="#0f172a"/>
  <rect x="34" y="21" width="4" height="1" fill="#0f172a"/>
</svg>
