<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Excalibur, Sword of Legends -->
  <!-- Golden & Divine Blue Aura -->
  <line x1="44" y1="44" x2="60" y2="12" stroke="#67e8f9" stroke-width="8" opacity="0.3"/>
  <!-- Pure Silver Blessed Blade -->
  <line x1="44" y1="44" x2="60" y2="12" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="45" y1="43" x2="59" y2="13" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="59,10 62,12 58,15" fill="#ffffff"/>
  <!-- Golden Crown Guard with Ruby -->
  <rect x="41" y="42" width="10" height="4" fill="#f59e0b" transform="rotate(-30 46 44)"/>
  <circle cx="45" cy="43" r="1.5" fill="#ef4444"/>
  <!-- Regal Grip & Pommel -->
  <line x1="43" y1="47" x2="39" y2="54" stroke="#1e1b4b" stroke-width="3"/>
  <polygon points="38,53 41,54 39,57 36,56" fill="#f59e0b"/>
</svg>
